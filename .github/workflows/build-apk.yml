name: Build Android TWA APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Initialize and Build TWA
        run: |
          # Инициализация с принудительной генерацией структуры
          bubblewrap update --manifest=twa-manifest.json || bubblewrap init --manifest=twa-manifest.json --batch
          
          # Сборка проекта
          bubblewrap build

      - name: Check files and find APK
        run: |
          find . -name "*.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TurovFy-APK
          path: |
            *.apk
            app/build/outputs/apk/release/*.apk
            app-release-signed.apk
